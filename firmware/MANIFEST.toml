# Vendor firmware images, pinned by content hash.
#
# The binaries themselves are gitignored. This file is what makes a run
# reproducible: if the hash here does not match the file on disk, the run is
# not the run this repo describes.
#
# All four images are complete merged flash images (bootloader at 0x0,
# partition table at 0x8000, app at 0x10000) and all four share a
# byte-identical boot stage:
#
#   region 0x0000..0x8000  (bootloader)      sha256 491e22feb4ee7f27...
#   region 0x8000..0x8c00  (partition table) sha256 bd0f7954aca2ef7d...
#
# That shared boot stage is why the examples work as controls: boot any one of
# them to the ROM's `entry` line and the flash/cache/MMU/UART/eFuse path is
# validated for all of them. See docs/BOOT.md.

source_repo = "https://github.com/Xinyuan-LilyGO/T-Deck-MAX"
retrieved   = "2026-08-21"

[[image]]
name    = "factory"
role    = "Vendor factory demo. Exercises every subsystem at once."
path    = "T-Deck-MAX_V3.1_20260313.bin"
