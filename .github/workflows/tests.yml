# The fast test tier on every push and pull request (ADR 0162). It needs no
# QEMU and no vendor firmware: what needs them is the slow tier, which skips
# without them and runs where both are built (ADR 0012).
name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest --basetemp=/tmp/pytest
