# A release is a tag, vX.Y.Z (ADR 0181): from it, the runtime image goes to
# ghcr.io/prolificlab/boardemul:X.Y.Z and the package to PyPI (ADR 0183),
# once the fast tier passes and the tag names the version the code carries.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: The tag names the version the code carries
        run: |
          version=$(python -c "from emu.version import VERSION; print(VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but emu/version.py says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m pip install pytest
      - run: python -m pytest --basetemp=/tmp/pytest

  image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the runtime image
        env:
          IMAGE: ghcr.io/prolificlab/boardemul:${{ needs.check.outputs.version }}
        run: |
          sources=$(python3 -c "from tools.doctor import sources_digest; print(sources_digest())")
          docker build -t "$IMAGE" --build-arg "BOARDEMUL_SOURCES=$sources" \
              -f docker/runtime/Dockerfile .
          docker push "$IMAGE"

  package:
    needs: check
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write          # PyPI's trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: A GitHub release with the changelog's section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' \
              CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "BoardEmul $VERSION" \
              --notes-file notes.md
