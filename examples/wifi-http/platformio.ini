;
; A firmware that joins a WiFi network and answers HTTP, to test on BoardEmul
; without the board: `pio run`, then `boardemul scenario check.toml`.

[env:t-deck]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DWIFI_NAME=\"boardemul-lab\"
    -DWIFI_PASSWORD=\"correct-horse-battery\"

; The same firmware with Arduino's default modem sleep, for the emulator's
; own work on waking a dozing station.
[env:t-deck-sleep]
extends = env:t-deck
build_flags =
    ${env:t-deck.build_flags}
    -DBOARDEMUL_MODEM_SLEEP
