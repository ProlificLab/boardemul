[pytest]
testpaths = tests
markers =
    slow: boots real firmware under QEMU; minutes, not milliseconds
    alone: a slow test whose firmware keeps deadlines on the host's time; run it with nothing else booting (ADR 0167)
# ADR 0012: slow tests are opt-in. A command-line -m overrides this one,
# so `pytest -m slow` still selects them.
# --basetemp keeps each slow test's run directory on the bind mount, so a
# boot that stalls under load leaves its UART and bus logs behind to read.
addopts = -q --strict-markers -m "not slow" --basetemp=logs/pytest
