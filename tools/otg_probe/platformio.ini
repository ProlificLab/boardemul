; The USB OTG probe (ADR 0166): TinyUSB's CDC port on the S3's OTG
; controller, as Meshtastic's T-Deck build has it (ARDUINO_USB_MODE=0,
; ARDUINO_USB_CDC_ON_BOOT=1: Serial is USB, Serial0 the UART). Same ESP-IDF
; 4.4 as the vendor builds (Arduino-ESP32 2.0.14), as tools/restart_probe.
; tests/test_usb_otg_probe.py boots it, and skips until it is built:
;
;   python tools/otg_probe/build.py
;
; which writes firmware/otg_probe.bin.

[env:probe]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
build_unflags = -DARDUINO_USB_MODE=1
build_flags = -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1
