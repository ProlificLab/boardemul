; The serial probe (ADR 0156): answers each line typed into UART0 or the USB
; Serial/JTAG port. Same ESP-IDF 4.4 as the vendor builds (Arduino-ESP32
; 2.0.14), as tools/restart_probe. tests/test_serial_probe.py boots it, and
; skips until it is built:
;
;   python tools/serial_probe/build.py
;
; which writes firmware/serial_probe.bin. To type to it by hand, start it and
; use the page's console, or add a "serial" event to the run's input.jsonl.

[env:probe]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
