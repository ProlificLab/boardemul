; The audio probe (ADR 0146): records a second from I2S1 and says what it
; heard, then plays a 1 kHz tone on I2S0. Same ESP-IDF 4.4 as the vendor
; builds (Arduino-ESP32 2.0.14), as tools/restart_probe.
; tests/test_audio_probe.py boots it, and skips until it is built:
;
;   python tools/audio_probe/build.py
;
; which writes firmware/audio_probe.bin. To hear it by hand:
;
;   python3 tools/tone.py write tone.wav --hz 440
;   python3 emu/run.py firmware/audio_probe.bin --board tdeck --bus --audio --mic tone.wav

[env:probe]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
