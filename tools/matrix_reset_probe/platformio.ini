; The matrix reset probe (ADR 0142): raises a GPIO interrupt with the CPU's
; interrupt masked, resets the digital system through SW_SYS_RESET, and says
; whether a new edge on the same pin reaches the CPU after it. Same ESP-IDF
; 4.4 as the vendor builds (Arduino-ESP32 2.0.14), as tools/restart_probe.
; tests/test_matrix_reset_probe.py boots it, and skips until it is built:
;
;   python tools/matrix_reset_probe/build.py
;
; which writes firmware/matrix_reset_probe.bin. To watch it by hand:
;
;   python3 emu/run.py firmware/matrix_reset_probe.bin --board tdeck --bus --reboot --stall 20

[env:probe]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
