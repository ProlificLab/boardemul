; The CPENABLE probe (ADR 0143): reads CPENABLE in a C++ global constructor,
; before FreeRTOS starts, on a power-on boot, after esp_restart() and after a
; digital system reset. Same ESP-IDF 4.4 as the vendor builds (Arduino-ESP32
; 2.0.14), as tools/restart_probe. tests/test_cpenable_probe.py boots it, and
; skips until it is built:
;
;   python tools/cpenable_probe/build.py
;
; which writes firmware/cpenable_probe.bin. To watch it by hand:
;
;   python3 emu/run.py firmware/cpenable_probe.bin --board tdeck --bus --reboot --stall 20

[env:probe]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
