; The sleep probe (ADR 0165): light-sleeps on the RTC timer, then until GPIO 0
; is low, and says each time what woke it. Same ESP-IDF 4.4 as the vendor
; builds (Arduino-ESP32 2.0.14), as tools/restart_probe. tests/test_sleep_probe.py
; boots it, and skips until it is built:
;
;   python tools/sleep_probe/build.py
;
; which writes firmware/sleep_probe.bin.

[env:probe]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
