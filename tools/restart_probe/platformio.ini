; The restart probe (ADR 0123): restarts the chip once from each core, by
; esp_restart() and by abort(), on the same ESP-IDF 4.4 the vendor builds use
; (Arduino-ESP32 2.0.14). tests/test_restart_probe.py boots it, and skips
; until it is built:
;
;   python tools/restart_probe/build.py
;
; which writes firmware/restart_probe.bin. To watch it by hand:
;
;   python3 emu/run.py firmware/restart_probe.bin --board tdeck --bus --reboot --stall 20
;
; Each restart should be followed by one ROM banner and the next "probe: boot".

[env:probe]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
