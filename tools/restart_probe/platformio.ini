; The restart probe (ADR 0123): restarts the chip once from each core, by
; esp_restart() and by abort(), on the same ESP-IDF 4.4 the vendor builds use
; (Arduino-ESP32 2.0.14). Not vendor firmware, so not a test input (ADR 0012);
; it is how ADR 0123 was measured, kept so the measurement can be repeated.
;
;   python -m platformio run -d tools/restart_probe
;   P=tools/restart_probe/.pio/build/probe
;   python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 \
;       merge_bin -o logs/restart_probe.bin --flash_mode dio --flash_size 16MB \
;       0x0 $P/bootloader.bin 0x8000 $P/partitions.bin \
;       0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
;       0x10000 $P/firmware.bin
;   python3 emu/run.py logs/restart_probe.bin --board tdeck --bus --reboot --stall 20
;
; Each restart should be followed by one ROM banner and the next "probe: boot".

[env:probe]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
